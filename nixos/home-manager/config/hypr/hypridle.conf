# hypridle configuration (hypridle still uses the hyprlang .conf format)
# NOTE: the dpms dispatch commands use the Lua-era hyprctl syntax
# (hl.dsp...) because the running Hyprland uses a hyprland.lua config.
# The old "hyprctl dispatch dpms off" syntax is rejected by Hyprland
# when its config is in Lua format.

general {
    # lock_cmd = pidof hyprlock || hyprlock    # uncomment if you use hyprlock
    # unlock_cmd = notify-send "unlock!"       # same as above, but unlock
    # before_sleep_cmd = loginctl lock-session # lock before suspend
    # after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # turn on display after suspend
    ignore_dbus_inhibit = false              # whether to ignore dbus-sent idle-inhibit requests
}

# Turn off monitors after 5 minutes of inactivity
listener {
    timeout = 300                            # 5 minutes in seconds
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'   # turn off monitors
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'     # turn on monitors when activity detected
}
