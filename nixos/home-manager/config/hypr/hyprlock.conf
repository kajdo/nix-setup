# Hyprlock Configuration
# Minimalistic but elegant lock screen
# (hyprlock still uses the hyprlang .conf format)

# Background
background {
    monitor = 
    path = screenshot  # Use current screen content
    color = rgba(25, 20, 30, 0.6)  # Dark overlay

    # Blur effect
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.8
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.5
}

# Time display
label {
    monitor = 
    text = $TIME
    color = rgba(200, 200, 200, 0.9)
    font_size = 90
    font_family = JetBrains Mono
    position = 0, -200
    halign = center
    valign = center
}

# Date display
label {
    monitor = 
    text = cmd[update:1000] date "+%A, %B %d"
    color = rgba(180, 180, 180, 0.8)
    font_size = 24
    font_family = JetBrains Mono
    position = 0, -120
    halign = center
    valign = center
}

# Password input field
input-field {
    monitor = 
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(80, 80, 80, 0.2)
    inner_color = rgba(40, 40, 40, 0.3)
    font_color = rgba(200, 200, 200, 0.9)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = 
    hide_input = false
    rounding = 15
    check_color = rgba(204, 136, 34, 1)
    fail_color = rgba(204, 34, 34, 1)
    fail_text = <i>Incorrect password</i>
    fail_transition = 300
    capslock_color = rgba(204, 136, 34, 1)
    numlock_color = rgba(204, 136, 34, 1)
    bothlock_color = rgba(204, 136, 34, 1)
    invert_numlock = false
    swap_font_color = false
    position = 0, 20
    halign = center
    valign = center
}

# User profile image
image {
    monitor = 
    path = $HOME/.face
    size = 100
    rounding = -1
    border_size = 3
    border_color = rgba(200, 200, 200, 0.8)
    position = 0, -200
    halign = center
    valign = center
    reload_time = -1
    reload_cmd = 
}

# Username label
label {
    monitor = 
    text = $USER
    color = rgba(200, 200, 200, 0.9)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, -280
    halign = center
    valign = center
}

# Session info (optional - remove if you want even more minimal)
label {
    monitor = 
    text = cmd[update:1000] echo "Locked • $(uptime -p | sed 's/up //')"
    color = rgba(150, 150, 150, 0.6)
    font_size = 14
    font_family = JetBrains Mono
    position = 20, 20
    halign = left
    valign = top
}
